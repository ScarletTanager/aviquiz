name: Security checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 9 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Quiz and authorization regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install and verify browser authentication library
        run: |
          npm ci --ignore-scripts
          npm run build:auth
          git diff --exit-code -- dist/oidc-client-ts.mjs dist/jwt-decode.mjs
          node test-auth.mjs
      - name: Check selection, history, geography, and statistics
        run: |
          node test.mjs
          node test-audio.mjs
          node test-context.mjs
      - name: Check application flows and unavailable audio catalog
        run: |
          node test-app-audio.mjs
          AUDIO_CATALOG_FAIL=1 node test-app-audio.mjs
      - name: Check account identity, bootstrap, and route permissions
        run: |
          node test-accounts.mjs
          node test-account-api.mjs
      - name: Build and check live review API authorization
        run: |
          node scripts/build-worker.mjs
          node test-review.mjs
          node test-review-permissions.mjs
          node test-http.mjs
          node test-invitations.mjs
          node test-geography.mjs
          node test-release-source.mjs

  ebd-preparation:
    name: Offline EBD preparation safety
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Check regional routing, priorities, and incomplete-source safety
        run: |
          python -B scripts/test-ebd-partition.py
          python -B scripts/test-ebd-local-sizing.py
          python -B scripts/test-ebd-ingest.py

  database:
    strategy:
      matrix:
        postgres: [17, 18]
    name: SQLite and PostgreSQL ${{ matrix.postgres }} integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: aviquiz_test
          POSTGRES_DB: aviquiz_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U aviquiz_test -d aviquiz_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install and build Worker
        run: |
          npm ci --ignore-scripts
          node scripts/build-worker.mjs
      - name: Run cross-provider integration checks
        env:
          TEST_DATABASE_URL: postgresql://aviquiz_test@127.0.0.1:5432/aviquiz_test
        run: node test-database.mjs

  secrets:
    name: Gitleaks full-history scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" --output "$archive"
          echo "$GITLEAKS_SHA256  $archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Verify custom detection rules using disposable synthetic secrets
        run: python3 scripts/test-secret-rules.py
      - name: Scan every fetched ref with redacted output
        run: gitleaks git --config .gitleaks.toml --log-opts="--all" --redact=100 --exit-code 1 --no-banner

  dependencies:
    name: Python dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install audit tool
        run: python -m pip install --disable-pip-version-check 'pip-audit==2.10.1'
      - name: Audit pinned direct and transitive offline-tool dependencies
        run: python -m pip_audit --strict --no-deps --disable-pip -r requirements-dev.txt
