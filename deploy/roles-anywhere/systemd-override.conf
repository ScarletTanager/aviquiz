[Service]
SupplementaryGroups=aviquiz-auth
Environment=AWS_PROFILE=aviquiz-invitations
Environment=AWS_CONFIG_FILE=/etc/aviquiz/roles-anywhere/aws-config
Environment=AWS_SHARED_CREDENTIALS_FILE=/etc/aviquiz/roles-anywhere/no-static-credentials
Environment=AWS_SDK_LOAD_CONFIG=1
Environment=AWS_EC2_METADATA_DISABLED=true
# Prevent inherited static/session credentials from taking precedence.
UnsetEnvironment=AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_WEB_IDENTITY_TOKEN_FILE AWS_ROLE_ARN AWS_CONTAINER_CREDENTIALS_RELATIVE_URI AWS_CONTAINER_CREDENTIALS_FULL_URI AWS_CONTAINER_AUTHORIZATION_TOKEN AWS_CONTAINER_AUTHORIZATION_TOKEN_FILE AWS_ENDPOINT_URL AWS_ENDPOINT_URL_COGNITO_IDENTITY_PROVIDER
